description: Frazer Consultants is a funeral-home technology company providing
  all-in-one death-care software - responsive funeral home websites, the FrazerGO
  funeral home management system, Tribute Pay payments, the Tribute Store (flowers,
  gifts, trees), and the Tribute Center (tribute videos, personalized stationery,
  and live or delayed webcasting). Frazer is now part of Tribute Technology, and its
  products connect into the Tribute Technology full-stack platform. Frazer markets an
  "open-source API" that lets its websites integrate with third-party data management,
  call forwarding, and webcasting software, and Tribute Technology connects Premier
  Partners to its Platform Services through proprietary APIs. However, as of this
  writing there is NO public developer portal, no published API reference, and no
  self-serve OpenAPI - API/integration access is partner-gated and arranged directly
  with Frazer / Tribute Technology. This entry is therefore an honest stub documenting
  the access model rather than a documented public API.
