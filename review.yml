  reason: |
    Frazer Consultants exposes no documented public API (REST or WebSocket), so no
    APIs were enumerated and no AsyncAPI, OpenAPI, plans, rate-limits, finops, or
    collections artifacts were created. The apis.yml documents the company, its
    products, the Tribute Technology relationship, and the partner-gated access
    model honestly as a stub, without fabricating endpoints.
